version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories: ["/terraform", "/terraform/modules/region"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
