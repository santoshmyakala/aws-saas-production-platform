# Reusable: plan (and optionally apply) one environment with short-lived AWS credentials via GitHub OIDC.
# No AWS keys are stored in GitHub. The IAM role trusts only this repository + environment (see docs/ci-cd.md).
name: terraform-environment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (staging | production); its protection rules gate the apply
        type: string
        required: true
      apply:
        description: Apply the reviewed plan after planning
        type: boolean
        default: false
      api_image:
        description: Optional API image override (registry/repo@sha256:...)
        type: string
        default: ""
      worker_image:
        description: Optional worker image override (registry/repo@sha256:...)
        type: string
        default: ""
    outputs:
      changes:
        description: true when the plan contains changes
        value: ${{ jobs.terraform.outputs.changes }}
    secrets:
      ORIGIN_VERIFY_HEADER:
        required: true

permissions:
  contents: read
  id-token: write # OIDC token for AWS STS

jobs:
  terraform:
    name: ${{ inputs.apply && 'apply' || 'plan' }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Plans run in unprotected plan-<env> environments (read-only role); applies run in the protected
    # <env> environments (main branch only, required reviewers for production, deploy role).
    environment: ${{ inputs.apply && inputs.environment || format('plan-{0}', inputs.environment) }}
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_origin_verify_header: ${{ secrets.ORIGIN_VERIFY_HEADER }}
      TF_VAR_api_image: ${{ inputs.api_image }}
      TF_VAR_worker_image: ${{ inputs.worker_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.apply && vars.AWS_DEPLOY_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Environment variables file (non-secret, from the environment's TFVARS variable)
        env:
          TFVARS: ${{ vars.TFVARS }}
        run: |
          printf '%s\n' "$TFVARS" > ci.auto.tfvars
      - run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Plan
        id: plan
        run: |
          # empty overrides must not shadow the environment's TFVARS values
          [ -n "$TF_VAR_api_image" ] || unset TF_VAR_api_image
          [ -n "$TF_VAR_worker_image" ] || unset TF_VAR_worker_image
          set +e
          terraform plan -lock-timeout=5m -detailed-exitcode -no-color -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          [ $code -eq 1 ] && exit 1
          echo "changes=$([ $code -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan — ${{ inputs.environment }}"
            grep -E '^Plan:|^No changes' plan.txt || true
            echo '<details><summary>Full plan</summary>'; echo; echo '```hcl'; tail -c 60000 plan.txt; echo '```'; echo '</details>'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ inputs.environment }}
          path: |
            terraform/plan.txt
            terraform/summary.md
          retention-days: 14
      - name: Apply exactly the plan that was shown
        if: inputs.apply && steps.plan.outputs.changes == 'true'
        run: terraform apply -lock-timeout=5m -no-color tfplan
      - name: Wait for the canary rollout to finish (rolled back automatically if an SLO alarm fires)
        if: inputs.apply && steps.plan.outputs.changes == 'true'
        run: |
          cluster=$(terraform output -raw ecs_cluster_name 2>/dev/null || echo "")
          [ -n "$cluster" ] || { echo "no cluster output; skipping rollout wait"; exit 0; }
          aws ecs wait services-stable --cluster "$cluster" --services api worker
          state=$(aws ecs describe-services --cluster "$cluster" --services api             --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' --output text)
          echo "API rollout state: $state" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$state" = "COMPLETED" ] || { echo "::error::rollout $state — ECS rolled the deployment back"; exit 1; }
      - name: Smoke test through CloudFront
        if: inputs.apply
        run: |
          url=$(terraform output -raw app_url)
          for _ in $(seq 1 30); do curl -fsS "$url/healthz/ready" && exit 0; sleep 10; done
          echo "::error::$url/healthz/ready did not become healthy"; exit 1
